<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#b80f1a">
<title>Tamarindo · Prueba Quagga2</title>
<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.12.1/dist/quagga.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif;height:100%}
header{height:58px;background:#b80f1a;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-weight:800}
#viewport{position:relative;width:100%;height:calc(100vh - 168px);min-height:360px;overflow:hidden;background:#000}
#viewport video,#viewport canvas{position:absolute!important;inset:0;width:100%!important;height:100%!important;object-fit:cover}
.guide{position:absolute;z-index:8;left:8%;right:8%;top:50%;height:2px;background:#f22;box-shadow:0 0 8px #f22}
.dots{position:absolute;z-index:9;left:12%;right:12%;top:calc(50% - 16px);height:32px;overflow:hidden;pointer-events:none}
.dots:before{content:"";position:absolute;left:-35%;top:13px;width:35%;height:6px;background:radial-gradient(circle,#ffd400 0 2px,transparent 3px) 0 0/14px 6px repeat-x;animation:sweep 1.25s linear infinite}
@keyframes sweep{to{left:100%}}
.frame{position:absolute;z-index:7;left:7%;right:7%;top:27%;bottom:27%;border:2px solid rgba(255,255,255,.55);pointer-events:none}
#panel{height:110px;padding:10px 14px;background:#171717}
.row{display:flex;gap:10px;align-items:center}.pill{background:#2a2a2a;border-radius:14px;padding:9px 12px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{border:0;border-radius:12px;padding:10px 14px;font-weight:800}.start{background:#fff;color:#111}.stop{background:#b80f1a;color:#fff}
#last{font-size:20px;font-weight:900}.muted{color:#bbb;font-size:12px;margin-top:7px}
.flash{animation:ok .18s ease}@keyframes ok{50%{box-shadow:inset 0 0 0 7px #24d26b}}
@media (orientation:landscape){#viewport{height:calc(100vh - 122px);min-height:220px}.frame{left:18%;right:18%;top:20%;bottom:20%}#panel{height:64px;display:flex;align-items:center;gap:10px;padding:7px 12px}.muted{display:none}.pill{padding:8px 10px}}
</style>
</head>
<body>
<header><span>tamarindo · PRUEBA QUAGGA2</span><span id="state">DETENIDO</span></header>
<div id="viewport"><div class="frame"></div><div class="guide"></div><div class="dots"></div></div>
<div id="panel">
  <div class="row" style="flex:1">
    <button class="start" id="start">INICIAR</button>
    <button class="stop" id="stop">DETENER</button>
    <div class="pill"><span id="last">Sin lectura</span></div>
    <div class="pill" style="flex:0 0 auto"><b id="count">0</b> lecturas</div>
  </div>
  <div class="muted">Prueba aislada: Code 128 / EAN / UPC. Pausa de 1 segundo después de cada lectura.</div>
</div>
<script>
let running=false, lockedUntil=0, count=0, audioCtx=null;
const $=id=>document.getElementById(id);
function beep(){
 try{
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.frequency.value=1150; g.gain.value=.18; o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime+.10);
 }catch(e){}
}
function start(){
 if(running)return;
 if(typeof Quagga==="undefined"){alert("No cargó Quagga2. Esta prueba necesita internet.");return}
 $("state").textContent="ABRIENDO...";
 Quagga.init({
  inputStream:{
   name:"Live",type:"LiveStream",target:document.querySelector("#viewport"),
   constraints:{facingMode:"environment",width:{ideal:1920},height:{ideal:1080}},
   area:{top:"12%",right:"6%",left:"6%",bottom:"12%"}
  },
  locate:true, frequency:12,
  locator:{halfSample:false,patchSize:"small"},
  decoder:{readers:["code_128_reader","ean_reader","ean_8_reader","upc_reader","upc_e_reader"]}
 },err=>{
  if(err){$("state").textContent="ERROR";alert("No se pudo abrir la cámara: "+err);return}
  Quagga.start();running=true;$("state").textContent="BUSCANDO";
 });
}
function stop(){if(!running)return;Quagga.stop();running=false;$("state").textContent="DETENIDO"}
Quagga.onDetected(data=>{
 if(!running||Date.now()<lockedUntil)return;
 const code=(data&&data.codeResult&&data.codeResult.code||"").trim();
 if(!code)return;
 lockedUntil=Date.now()+1000;
 count++;$("count").textContent=count;$("last").textContent=code;$("state").textContent="LEÍDO";
 document.body.classList.remove("flash");void document.body.offsetWidth;document.body.classList.add("flash");beep();
 setTimeout(()=>{if(running)$("state").textContent="BUSCANDO"},1000);
});
$("start").onclick=start;$("stop").onclick=stop;
window.addEventListener("beforeunload",()=>{try{Quagga.stop()}catch(e){}});
</script>
</body></html>
